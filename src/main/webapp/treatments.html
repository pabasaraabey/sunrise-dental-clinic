<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treatments — Sunrise Dental Clinic</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <h1 class="page-title">Treatments and prices</h1>
        <p class="page-lede">
            Prices are stored here rather than fixed in the program, so they can
            be revised without redeploying. Changing a price affects future bills
            only — receipts already issued keep the amounts actually charged.
        </p>

        <div id="notice" class="notice"></div>

        <section class="panel">
            <h2 id="formTitle">Add a treatment</h2>
            <div class="panel-body">
                <form id="treatmentForm" autocomplete="off">
                    <input type="hidden" id="treatmentId">

                    <div class="field">
                        <label for="name">Treatment name <span class="req">*</span></label>
                        <input type="text" id="name" placeholder="Composite Filling">
                        <div class="field-error"></div>
                    </div>

                    <div class="field">
                        <label for="description">Description</label>
                        <input type="text" id="description"
                               placeholder="Tooth-coloured restoration of a decayed tooth">
                        <div class="field-error"></div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="baseCost">Price (LKR) <span class="req">*</span></label>
                            <input type="text" id="baseCost" placeholder="6500.00" class="tabular">
                            <div class="field-error"></div>
                        </div>
                        <div class="field">
                            <label for="durationMinutes">Duration (minutes) <span class="req">*</span></label>
                            <input type="text" id="durationMinutes" placeholder="45" class="tabular">
                            <div class="field-error"></div>
                        </div>
                    </div>

                    <div class="actions" style="margin-top:16px">
                        <button type="submit" id="saveBtn">Add treatment</button>
                        <button type="button" class="btn-secondary" id="cancelEdit"
                                style="display:none" onclick="resetForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="panel">
            <h2>Price list</h2>
            <div class="panel-body" style="padding:0" id="listBody">
                <p class="empty">Loading…</p>
            </div>
        </section>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/validators.js"></script>
<script>
let treatments = [];

(async () => {
    const user = await Ui.requireSession();
    Ui.renderShell(user, 'treatments.html');
    await load();
})();

async function load() {
    try {
        treatments = await Api.treatments(false);
        render();
    } catch (error) {
        Ui.notice('notice', 'error', error.message);
    }
}

function render() {
    const body = document.getElementById('listBody');

    if (!treatments.length) {
        body.innerHTML = '<p class="empty">No treatments yet. Add the first one above.</p>';
        return;
    }

    body.innerHTML = '<table><thead><tr>'
        + '<th>Treatment</th><th>Description</th>'
        + '<th class="amount">Price (LKR)</th><th class="amount">Minutes</th>'
        + '<th>Status</th><th></th>'
        + '</tr></thead><tbody>'
        + treatments.map(t => '<tr>'
            + '<td>' + Ui.escape(t.name) + '</td>'
            + '<td style="color:var(--ink-soft)">'
            + Ui.escape(t.description || '—') + '</td>'
            + '<td class="amount">' + Ui.money(t.baseCost) + '</td>'
            + '<td class="amount">' + t.durationMinutes + '</td>'
            + '<td><span class="pill ' + (t.active ? 'completed' : 'cancelled') + '">'
            + (t.active ? 'active' : 'retired') + '</span></td>'
            + '<td>'
            + '<a href="#" onclick="edit(' + t.treatmentId + ');return false;">Edit</a>'
            + ' · <a href="#" onclick="toggle(' + t.treatmentId + ',' + !t.active
            + ');return false;">' + (t.active ? 'Retire' : 'Reinstate') + '</a>'
            + '</td>'
            + '</tr>').join('')
        + '</tbody></table>';
}

function edit(id) {
    const t = treatments.find(x => x.treatmentId === id);
    if (!t) return;

    document.getElementById('treatmentId').value      = t.treatmentId;
    document.getElementById('name').value             = t.name;
    document.getElementById('description').value      = t.description || '';
    document.getElementById('baseCost').value         = t.baseCost;
    document.getElementById('durationMinutes').value  = t.durationMinutes;

    document.getElementById('formTitle').textContent = 'Edit ' + t.name;
    document.getElementById('saveBtn').textContent   = 'Save changes';
    document.getElementById('cancelEdit').style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
    document.getElementById('treatmentForm').reset();
    document.getElementById('treatmentId').value = '';
    document.getElementById('formTitle').textContent = 'Add a treatment';
    document.getElementById('saveBtn').textContent = 'Add treatment';
    document.getElementById('cancelEdit').style.display = 'none';
    Validate.clearAll('treatmentForm');
}

async function toggle(id, activate) {
    Ui.clearNotice('notice');
    try {
        const result = await Api.setTreatmentActive(id, activate);
        Ui.notice('notice', 'ok', result.message);
        await load();
    } catch (error) {
        Ui.notice('notice', 'error', error.message);
    }
}

document.getElementById('treatmentForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    Ui.clearNotice('notice');
    Validate.clearAll('treatmentForm');

    const checks = [Validate.required('name', 'Treatment name')];

    const price = document.getElementById('baseCost').value.trim();
    // Two decimal places at most — the column is DECIMAL(10,2) and anything
    // finer would be silently truncated by the database.
    if (!/^\d+(\.\d{1,2})?$/.test(price)) {
        checks.push(Validate.markInvalid('baseCost',
            'Enter an amount such as 6500 or 6500.00'));
    } else {
        Validate.markValid('baseCost');
    }

    const minutes = document.getElementById('durationMinutes').value.trim();
    if (!/^\d+$/.test(minutes) || Number(minutes) < 1 || Number(minutes) > 480) {
        checks.push(Validate.markInvalid('durationMinutes',
            'Enter a whole number of minutes between 1 and 480'));
    } else {
        Validate.markValid('durationMinutes');
    }

    if (checks.includes(false)) return;

    const idValue = document.getElementById('treatmentId').value;

    const payload = {
        treatmentId:     idValue ? Number(idValue) : null,
        name:            document.getElementById('name').value.trim(),
        description:     document.getElementById('description').value.trim() || null,
        baseCost:        price,
        durationMinutes: Number(minutes)
    };

    const button = document.getElementById('saveBtn');
    button.disabled = true;

    try {
        await Api.saveTreatment(payload);
        Ui.notice('notice', 'ok', idValue ? 'Treatment updated.' : 'Treatment added.');
        resetForm();
        await load();

    } catch (error) {
        Ui.notice('notice', error.status === 409 ? 'warn' : 'error', error.message);

    } finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
